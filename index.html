<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f8">
<title>轻量记账 · 更新版</title>
<!-- 引入 ECharts 图表库 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<!-- 引入 SheetJS 用于 Excel 导入导出 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- 引入 SortableJS 用于拖拽排序 -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
:root{
  --bg:#f7f7f8; --card:#fff; --text:#111114; --sub:#8a8a8e; --line:#e9e9ec; --accent:#111114;
  --green:#34c759; --red:#ff3b30; --yellow:#ffcc00; --blue:#007aff; --orange:#ff9500;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0d0d0f; --card:#1a1a1d; --text:#f2f2f4; --sub:#8e8e93; --line:#2b2b2f; --accent:#f2f2f4; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html, body { margin:0; padding:0; width:100%; max-width:100vw; overflow-x:hidden; position:relative; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.wrap{max-width:900px; width:100%; margin:0 auto; padding:20px 16px calc(60px + env(safe-area-inset-bottom)); overflow-x:hidden;}

/* 导航 */
.nav{display:flex;gap:10px;margin-bottom:20px;justify-content:center;}
.nav button{padding:10px 20px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:.2s;}
.nav button.on{background:var(--accent);color:var(--card);border-color:var(--accent);}
.view{display:none;width:100%;}
.view.on{display:block;}

/* 记账页 */
.header-stats{text-align:center;margin-bottom:20px;}
.total{font-size:40px;font-weight:700;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;width:100%;}
.type-toggle{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:12px;width:100%;}
.type-toggle button{flex:1;padding:8px;border-radius:8px;border:0;background:transparent;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer;transition:.2s;}
.type-toggle button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.amtrow{display:flex;align-items:center;gap:6px;padding:2px 6px 8px;width:100%;}
.cur{font-size:26px;font-weight:600;color:var(--sub);}
#amt{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--text);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;width:100%;}
.cats::-webkit-scrollbar{display:none;}
.cat{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--sub);padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;}
.cat.on{background:var(--accent);color:var(--card);border-color:var(--accent);}
.note-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;width:100%;}
.note{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:15px;outline:none;}

/* 标签开关 */
.tag-toggles{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
.toggle-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--bg);user-select:none;}
.toggle-label input{width:16px;height:16px;margin:0;cursor:pointer;}
.toggle-label.r.active{color:var(--orange);background:rgba(255,149,0,0.1);font-weight:600;}

.btns{display:flex;gap:8px;margin-top:16px;width:100%;}
.primary{flex:1;background:var(--accent);color:var(--card);border-radius:12px;padding:13px;font-size:15px;font-weight:600;border:0;cursor:pointer;width:100%;}

/* 搜索框 */
.search-box{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;outline:none;margin-bottom:16px;}

/* 列表 */
.dayhd{display:flex;justify-content:space-between;padding:0 6px 8px;font-size:12px;color:var(--sub);}
.rows{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);width:100%;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:var(--card);}
.row:last-child{border-bottom:0;}
.row:active{background:var(--bg);}
.ico{width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-size:16px;}
.mid{flex:1;min-width:0;}
.cname{font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.memo{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.num{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.num.income{color:var(--green);}
.num.reimburse{color:var(--orange);}
/* 标签 */
.tag-reimburse{font-size:10px;padding:1px 4px;border-radius:4px;background:rgba(255,149,0,0.15);color:var(--orange);border:1px solid rgba(255,149,0,0.3);}
.tag-reimbursed{font-size:10px;padding:1px 4px;border-radius:4px;background:var(--bg);color:var(--sub);border:1px solid var(--line);}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:2;padding:56px 0;}

/* 看板页 */
.action-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.action-group{display:flex; gap:6px; flex-wrap:wrap;}
.action-btn{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;}
.action-btn.danger{color:var(--red);}

/* 待报销看板 */
.reimburse-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid var(--orange);display:none;}
.reimburse-card.show{display:block;}
.rc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.rc-title{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;}
.rc-amount{font-size:20px;font-weight:700;color:var(--orange);}
.rc-list{max-height:220px;overflow-y:auto;}
.rc-item{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line);}
.rc-item:last-child{border-bottom:0;}
.btn-settle{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:10px;font-size:13px;font-weight:600;width:100%;cursor:pointer;margin-top:12px;}

.dashboard-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;width:100%;}
@media (max-width: 768px) { .dashboard-grid{grid-template-columns:1fr;} }
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;}
.stat-card{background:var(--card);border-radius:16px;padding:16px;text-align:center;width:100%;}
.stat-card .lbl{font-size:12px;color:var(--sub);margin-bottom:8px;}
.stat-card .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-card.income .val{color:var(--green);}
.stat-card.expense .val{color:var(--red);}

/* 表格 */
.table-wrap{background:var(--card);border-radius:16px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.06);width:100%;max-width:100%;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px;}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-weight:500;background:var(--bg);}
tr:last-child td{border-bottom:0;}
.progress-bar{width:100px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
.progress-fill{height:100%;border-radius:4px;background:var(--blue);}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;}
.status.ok{color:var(--green);}
.status.warn{color:var(--yellow);}

/* 图表 */
#chart-container{width:100%;height:350px;background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-top:16px;box-sizing:border-box;}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:1000;padding:20px;}
.modal-overlay.show{display:grid;}
.modal{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:20px;max-height:90vh;overflow-y:auto;}
.modal h3{margin:0 0 16px;font-size:18px;}
.modal label{font-size:12px;color:var(--sub);margin-bottom:4px;display:block;}
.modal input,.modal select{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--bg);color:var(--text);outline:none;}
.modal .btns{display:flex;gap:10px;margin-top:20px;}
.modal .btn-del{background:var(--red);color:#fff;border-radius:10px;padding:12px;flex:1;font-weight:600;border:0;cursor:pointer;}
.modal .btn-save{background:var(--accent);color:var(--card);border-radius:10px;padding:12px;flex:2;font-weight:600;border:0;cursor:pointer;}

/* Toast */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:99;background:#18181b;color:#fff;padding:12px 18px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <button id="nav-record" class="on" onclick="switchView('record')">📝 记账</button>
    <button id="nav-dashboard" onclick="switchView('dashboard')">📊 看板</button>
  </div>

  <!-- 记账页 -->
  <div id="view-record" class="view on">
    <header class="header-stats">
      <div class="lbl">本月日常支出</div>
      <div class="total" id="total">¥0.00</div>
    </header>

    <section class="card">
      <div class="type-toggle">
        <button id="btn-expense" class="on" onclick="setType('expense')">支出</button>
        <button id="btn-income" onclick="setType('income')">收入</button>
      </div>
      <div class="amtrow">
        <span class="cur">¥</span>
        <input id="amt" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </div>
      <div class="cats" id="cats"></div>
      
      <div class="note-row">
        <input id="note" class="note" placeholder="备注(可选)" autocomplete="off" maxlength="40">
      </div>
      
      <div class="tag-toggles">
        <label class="toggle-label r" id="reimburse-label">
          <input type="checkbox" id="isReimburse"> 💼 垫付待报销
        </label>
      </div>

      <div class="btns">
        <button id="add" class="primary">记一笔支出</button>
      </div>
    </section>

    <input type="text" id="searchList" class="search-box" placeholder="🔍 搜索历史账单(备注或分类)..." oninput="renderList()">
    <div id="list"></div>
  </div>

  <!-- 看板页 -->
  <div id="view-dashboard" class="view">
    <div class="action-bar">
      <h2 style="margin:0;font-size:20px;">数据看板</h2>
      <div class="action-group">
        <button class="action-btn" onclick="document.getElementById('importFile').click()">📤 导入</button>
        <input type="file" id="importFile" accept=".xlsx,.xls,.json" style="display:none" onchange="handleImport(event)">
        <button class="action-btn" onclick="exportExcel()">📥 Excel</button>
        <button class="action-btn" onclick="backupJSON()">💾 备份</button>
        <button class="action-btn danger" onclick="clearAllData()">🗑️ 清空</button>
      </div>
    </div>

    <!-- 待报销模块 -->
    <div class="reimburse-card" id="reimburse-board">
      <div class="rc-header">
        <div class="rc-title">💼 本月待报销明细</div>
        <div class="rc-amount" id="rc-total">¥0.00</div>
      </div>
      <div class="rc-list" id="rc-reimburse-list"></div>
      <button class="btn-settle" onclick="settleReimburse()">✅ 标记为已报销（不再显示）</button>
    </div>
    
    <div class="dashboard-grid">
      <div id="chart-container"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>分类</th>
            <th>预算</th>
            <th>实际开销</th>
            <th>预算差额</th>
          </tr>
        </thead>
        <tbody id="dashboard-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>修改记录</h3>
    <label>金额</label>
    <input type="number" id="edit-amt" step="0.01" placeholder="金额">
    
    <label>日期</label>
    <input type="date" id="edit-date">
    
    <label>分类</label>
    <select id="edit-cat"></select>
    
    <label>备注</label>
    <input type="text" id="edit-note" placeholder="备注" maxlength="40">
    
    <div style="display:flex; gap:16px; margin-top:12px;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--orange);margin:0;cursor:pointer;">
        <input type="checkbox" id="edit-reimburse" style="width:16px;height:16px;margin:0;accent-color:var(--orange);"> 💼 垫付报销
      </label>
    </div>

    <div class="btns">
      <button class="btn-del" onclick="deleteRecord()">删除</button>
      <button class="btn-save" onclick="saveEdit()">保存修改</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 基础数据 ================= */
const CATS = [
  { id: 'food',    name: '餐饮', icon: '🍜' },
  { id: 'traffic', name: '交通', icon: '🚇' },
  { id: 'shop',    name: '购物', icon: '🛍️' },
  { id: 'daily',   name: '日用', icon: '🧴' },
  { id: 'fun',     name: '娱乐', icon: '🎬' },
  { id: 'home',    name: '住宿', icon: '🏠' },
  { id: 'med',     name: '医疗', icon: '💊' },
  { id: 'other',   name: '其他', icon: '📦' }
];
const INCOME_CATS = [
  { id: 'salary', name: '工资', icon: '💰' },
  { id: 'bonus',  name: '奖金', icon: '🎁' },
  { id: 'invest', name: '理财', icon: '📈' },
  { id: 'other_in',name: '其他', icon: '💵' }
];

const KEY = 'linkbook.v6'; // 升级版本
let rows = load();
let currentType = 'expense'; 
let currentCat = 'food';
let editingId = null;
let chartInstance = null;

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(d)) return d;
    return []; 
  } catch(e) { return []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(rows)); }
function p2(n) { return String(n).padStart(2, '0'); }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }
function fmt(n) {
  const s = Math.abs(Number(n)||0).toFixed(2), parts = s.split('.');
  return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + parts[1];
}

/* ================= 页面切换 ================= */
function switchView(view) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('on'));
  document.getElementById('view-' + view).classList.add('on');
  document.querySelectorAll('.nav button').forEach(el => el.classList.remove('on'));
  document.getElementById('nav-' + view).classList.add('on');
  if (view === 'dashboard') renderDashboard();
  else renderList();
}

/* ================= 记账页逻辑 ================= */
function setType(type) {
  currentType = type;
  document.getElementById('btn-expense').classList.toggle('on', type === 'expense');
  document.getElementById('btn-income').classList.toggle('on', type === 'income');
  renderCats();
  document.getElementById('add').textContent = type === 'expense' ? '记一笔支出' : '记一笔收入';
  if (type === 'expense') currentCat = 'food';
  else currentCat = 'salary';
}

function renderCats() {
  const catsEl = document.getElementById('cats');
  catsEl.innerHTML = '';
  const list = currentType === 'expense' ? CATS : INCOME_CATS;
  list.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat' + (c.id === currentCat ? ' on' : '');
    b.textContent = c.icon + ' ' + c.name;
    b.onclick = () => { currentCat = c.id; renderCats(); };
    catsEl.appendChild(b);
  });
}

// 标签联动
document.getElementById('isReimburse').addEventListener('change', function() {
  document.getElementById('reimburse-label').classList.toggle('active', this.checked);
});

function commit() {
  const amt = parseFloat(document.getElementById('amt').value);
  if (!isFinite(amt) || amt <= 0) { alert('请输入正确金额'); return; }
  const note = document.getElementById('note').value.trim().slice(0, 40);
  const isReimburse = document.getElementById('isReimburse').checked;
  
  rows.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    ts: Date.now(),
    amt: Math.round(amt * 100) / 100,
    cat: currentCat,
    note,
    type: currentType,
    isReimburse: isReimburse,
    reimbursed: false
  });
  save();
  
  // 重置表单
  document.getElementById('amt').value = '';
  document.getElementById('note').value = '';
  document.getElementById('isReimburse').checked = false;
  document.getElementById('reimburse-label').classList.remove('active');
  
  renderList();
  updateTopStats();
  showToast('记账成功');
}

/* ================= 列表渲染与拖拽 ================= */
function renderList() {
  const listEl = document.getElementById('list');
  const searchKey = document.getElementById('searchList').value.trim().toLowerCase();
  
  // 过滤搜索
  let filteredRows = rows;
  if (searchKey) {
    filteredRows = rows.filter(r => {
      const catObj = (r.type === 'income' ? INCOME_CATS : CATS).find(c => c.id === r.cat);
      const catName = catObj ? catObj.name : '';
      return (r.note && r.note.toLowerCase().includes(searchKey)) || catName.toLowerCase().includes(searchKey);
    });
  }

  if (!filteredRows.length) {
    listEl.innerHTML = '<div class="empty">' + (searchKey ? '未找到相关记录' : '还没有记录，记一笔吧') + '</div>';
    return;
  }

  // 按天分组，并保证同一天内的顺序按 ts 升序
  const sorted = filteredRows.slice().sort((a,b) => dayKey(b.ts).localeCompare(dayKey(a.ts)) || (b.order ?? b.ts) - (a.order ?? a.ts));
  const groups = new Map();
  sorted.forEach(r => {
    const k = dayKey(r.ts);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  let html = '';
  groups.forEach((items, k) => {
    let expSum = 0, incSum = 0;
    items.forEach(r => {
      if (r.type === 'income') incSum += r.amt;
      else if (!r.isReimburse) expSum += r.amt;
    });
    
    let sumStr = '';
    if (expSum > 0) sumStr += `日常支出 ¥${fmt(expSum)} `;
    if (incSum > 0) sumStr += `收入 ¥${fmt(incSum)}`;

    html += `<div class="day"><div class="dayhd"><span>${k}</span><span>${sumStr}</span></div><div class="rows" data-day="${k}">`;
    items.forEach(r => {
      const isInc = r.type === 'income';
      const catObj = (isInc ? INCOME_CATS : CATS).find(c => c.id === r.cat) || (isInc ? INCOME_CATS[3] : CATS[7]);
      const isR = r.isReimburse && !r.reimbursed;
      const isDone = r.isReimburse && r.reimbursed;
      
      let numClass = isInc ? 'income' : '';
      if (isR) numClass = 'reimburse';
      
      let tags = '';
      if (isR) tags += '<span class="tag-reimburse">待报销</span>';
      else if (isDone) tags += '<span class="tag-reimbursed">已报销</span>';

      html += `<div class="row" data-id="${r.id}" onclick="openEdit('${r.id}')">
        <div class="ico">${escapeText(catObj.icon)}</div>
        <div class="mid">
          <div class="cname">${escapeText(catObj.name)} ${tags}</div>
          ${r.note ? `<div class="memo">${escapeText(r.note)}</div>` : ''}
        </div>
        <div class="num ${numClass}">${isInc?'+':'-'}${fmt(r.amt)}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  listEl.innerHTML = html;

  // 绑定拖拽 (只在同一天内有效)
  if (searchKey || typeof Sortable === 'undefined') return;
  document.querySelectorAll('.rows').forEach(container => {
    new Sortable(container, {
      animation: 150,
      delay: 200, // 长按200ms触发拖拽，防止和点击冲突
      delayOnTouchOnly: true,
      onEnd: function (evt) {
        const dayStr = container.getAttribute('data-day');
        const newIds = Array.from(container.children).map(el => el.getAttribute('data-id'));
        
        // 获取那天的所有记录，按现在的顺序重新分配时间戳
        const baseTime = new Date(dayStr + 'T08:00:00').getTime();
        
        newIds.forEach((id, index) => {
          const r = rows.find(x => x.id === id);
          if (r) {
            r.order = newIds.length - index;
          }
        });
        save();
        renderList(); // 重新渲染以更新文字
        showToast('顺序已更新');
      }

}

function updateTopStats() {
  const now = new Date();
  let mTotal = 0;
  rows.forEach(r => {
    if (r.type === 'expense' && !r.isReimburse) {
      const d = new Date(r.ts);
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) mTotal += r.amt;
    }
  });
  document.getElementById('total').textContent = '¥' + fmt(mTotal);
}

/* ================= 编辑与删除 ================= */
function openEdit(id) {
  const r = rows.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  
  const catSelect = document.getElementById('edit-cat');
  catSelect.innerHTML = '';
  const list = r.type === 'income' ? INCOME_CATS : CATS;
  list.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.icon + ' ' + c.name;
    if (c.id === r.cat) opt.selected = true;
    catSelect.appendChild(opt);
  });

  document.getElementById('edit-amt').value = r.amt;
  // 日期格式转换 YYYY-MM-DD
  const d = new Date(r.ts);
  document.getElementById('edit-date').value = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  document.getElementById('edit-note').value = r.note || '';
  document.getElementById('edit-reimburse').checked = !!r.isReimburse;
  
  document.getElementById('modal').classList.add('show');
}

function saveEdit() {
  const r = rows.find(x => x.id === editingId);
  if (!r) return;
  const amt = parseFloat(document.getElementById('edit-amt').value);
  const dateVal = document.getElementById('edit-date').value;
  
  if (isFinite(amt) && amt > 0 && dateVal) {
    r.amt = Math.round(amt * 100) / 100;
    r.cat = document.getElementById('edit-cat').value;
    r.note = document.getElementById('edit-note').value.trim();
    
    // 修改日期
    const oldTime = new Date(r.ts);
    const newDate = new Date(dateVal + 'T' + p2(oldTime.getHours()) + ':' + p2(oldTime.getMinutes()) + ':00');
    r.ts = newDate.getTime();

    r.isReimburse = document.getElementById('edit-reimburse').checked;
    if (!r.isReimburse) r.reimbursed = false;

    save();
    renderList();
    updateTopStats();
  }
  closeModal();
}

function deleteRecord() {
  rows = rows.filter(x => x.id !== editingId);
  save();
  renderList();
  updateTopStats();
  closeModal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  editingId = null;
}

/* ================= 看板逻辑 ================= */
function renderDashboard() {
  const now = new Date();
  const curMonthRows = rows.filter(r => {
    const d = new Date(r.ts);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });

  let totalIncome = 0, totalExpense = 0;
  let pendingReimburseSum = 0;
  let pendingReimburseItems = [];

  curMonthRows.forEach(r => {
    if (r.type === 'income') {
      totalIncome += r.amt;
    } else if (r.isReimburse && !r.reimbursed) {
      pendingReimburseSum += r.amt;
      pendingReimburseItems.push(r);
    } else if (!r.isReimburse) {
      totalExpense += r.amt;
    }
  });

  // 1. 渲染待报销
  const rbBoard = document.getElementById('reimburse-board');
  if (pendingReimburseItems.length > 0) {
    rbBoard.classList.add('show');
    document.getElementById('rc-total').textContent = '¥' + fmt(pendingReimburseSum);
    pendingReimburseItems.sort((a,b) => b.ts - a.ts);
    let rlHtml = '';
    pendingReimburseItems.forEach(r => {
      const cat = CATS.find(c => c.id === r.cat) || CATS[7];
      rlHtml += `<div class="rc-item">
        <div class="rc-item-left">${dayKey(r.ts).slice(5)} · ${cat.name} ${r.note ? '('+escapeText(r.note)+')' : ''}</div>
        <div class="rc-item-right" style="font-weight:600;color:var(--orange);">¥${fmt(r.amt)}</div>
      </div>`;
    });
    document.getElementById('rc-reimburse-list').innerHTML = rlHtml;
  } else {
    rbBoard.classList.remove('show');
  }

  // 2. 统计卡片
  const dayOfMonth = now.getDate();

  // 3. 分类表格
  const catExpense = {};
  CATS.forEach(c => catExpense[c.id] = 0);
  curMonthRows.forEach(r => {
    if (r.type === 'expense' && !r.isReimburse) {
      if (catExpense[r.cat] !== undefined) catExpense[r.cat] += r.amt;
      else catExpense['other'] += r.amt;
    }
  });

  let tbody = '';
  let hasData = false;
  CATS.forEach(c => {
    const exp = catExpense[c.id];
    if (exp === 0) return; 
    hasData = true;
    const pct = totalExpense > 0 ? (exp / totalExpense * 100) : 0;
    let statusCls = 'ok', statusText = '正常';
    if (pct > 50) { statusCls = 'warn'; statusText = '占比较高'; }

    tbody += `<tr>
      <td><b>${c.name}</b></td>
      <td>¥${fmt(exp)}</td>
      <td>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${pct.toFixed(1)}%
      </td>
      <td><span class="status ${statusCls}">● ${statusText}</span></td>
    </tr>`;
  });

  if (!hasData) {
    tbody = '<tr><td colspan="4" style="text-align:center; color:var(--sub); padding:32px 0;">本月暂无日常支出记录</td></tr>';
  }
  document.getElementById('dashboard-tbody').innerHTML = tbody;

  renderChart();
}

// 结清报销
function settleReimburse() {
  if (!confirm('确定把这些待报销的账目标记为“已报销”吗？')) return;
  const now = new Date();
  rows.forEach(r => {
    const d = new Date(r.ts);
    if (r.isReimburse && !r.reimbursed && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) {
      r.reimbursed = true;
    }
  });
  save();
  renderDashboard();
  renderList();
  showToast('已结清！');
}

/* ================= 图表 ================= */
function renderChart() {
  if (typeof echarts === 'undefined') { document.getElementById('chart-container').textContent='图表未加载，请联网后刷新。'; return; }
  if (!chartInstance) chartInstance = echarts.init(document.getElementById('chart-container'));
  
  const months = []; const expData = []; const incData = [];
  const now = new Date();
  
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const y = d.getFullYear(); const m = d.getMonth();
    months.push((m + 1) + '月');
    let exp = 0, inc = 0;
    rows.forEach(r => {
      const rd = new Date(r.ts);
      if (rd.getFullYear() === y && rd.getMonth() === m) {
        if (r.type === 'income') inc += r.amt;
        else if (!r.isReimburse) exp += r.amt;
      }
    });
    expData.push(exp); incData.push(inc);
  }

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const textColor = isDark ? '#8e8e93' : '#8a8a8e';

  chartInstance.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    legend: { data: ['日常支出', '收入'], textStyle: { color: textColor } },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: { type: 'category', data: months, axisLine: { lineStyle: { color: textColor } }, axisLabel: { color: textColor } },
    yAxis: { type: 'value', axisLabel: { color: textColor, formatter: '¥{value}' }, splitLine: { lineStyle: { color: isDark ? '#2b2b2f' : '#e9e9ec' } } },
    series: [
      { name: '日常支出', type: 'bar', data: expData, itemStyle: { color: '#ff3b30', borderRadius: [4,4,0,0] }, barMaxWidth: 30 },
      { name: '收入', type: 'bar', data: incData, itemStyle: { color: '#34c759', borderRadius: [4,4,0,0] }, barMaxWidth: 30 }
    ]
  });
}

/* ================= 数据导入/导出 ================= */
function exportExcel() {
  if (!rows.length) { alert('没有数据'); return; }
  const exportData = rows.map(r => {
    const d = new Date(r.ts);
    const catObj = (r.type === 'income' ? INCOME_CATS : CATS).find(c => c.id === r.cat);
    let tag = r.isReimburse ? (r.reimbursed ? '已报销' : '待报销') : '';
    return {
      '日期': `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,
      '类型': r.type === 'refund' ? '退款' : r.type === 'income' ? '收入' : '支出',
      '分类': catObj ? catObj.name : '其他',
      '金额': r.amt,
      '报销状态': tag,
      '备注': r.note || '',
      '票据数量': (r.receipts || []).length,
      '票据文件': (r.receipts || []).map(f => f.name).join('；')
    };
  });
  const ws = XLSX.utils.json_to_sheet(exportData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "账单明细");
  XLSX.writeFile(wb, `记账数据_${dayKey(Date.now())}.xlsx`);
}

function backupJSON() {
  const blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `记账备份_${dayKey(Date.now())}.json`;
  a.click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      if (file.name.endsWith('.json')) {
        const imported = JSON.parse(e.target.result);
        mergeData(imported);
      } else {
        // 解析 Excel
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(firstSheet);
        const imported = json.map(row => {
          const type = row['类型'] === '退款' ? 'refund' : row['类型'] === '收入' ? 'income' : row['类型'] === '支出' ? 'expense' : 'invalid';
          const catObj = (type === 'income' ? INCOME_CATS : CATS).find(c => c.name === row['分类']);
          return {
            id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
            ts: excelDate(row['日期']),
            amt: Number(row['金额']),
            cat: catObj ? catObj.id : type === 'income' ? 'other_in' : 'other',
            type: type,
            isReimburse: row['报销状态'] === '待报销' || row['报销状态'] === '已报销',
            reimbursed: row['报销状态'] === '已报销',
            note: row['备注'] || ''
          };
        });
        mergeData(imported);
      }
    } catch(err) {
      alert('导入失败，文件格式不正确');
      console.error(err);
    }
    event.target.value = ''; // 清空选择
  };
  if (file.name.endsWith('.json')) reader.readAsText(file);
  else reader.readAsArrayBuffer(file);
}

// 智能去重合并逻辑
function mergeData(imported) {
  let added = 0;
  imported.forEach(newRow => {
    // 日期+金额+备注+类型 完全相同的，视为重复
    const exist = rows.find(r => 
      dayKey(r.ts) === dayKey(newRow.ts) && 
      r.amt === newRow.amt && 
      r.note === newRow.note &&
      r.type === newRow.type
    );
    if (!exist) {
      rows.push(newRow);
      added++;
    }
  });
  if (added > 0) {
    save();
    renderList();
    updateTopStats();
    renderDashboard();
    alert(`成功导入并合并了 ${added} 条新记录！`);
  } else {
    alert('没有发现新记录（数据完全重复或为空）');
  }
}

function clearAllData() {
  if (confirm('确定要清空所有本地记账数据吗？此操作不可恢复。')) {
    rows = []; save(); updateTopStats(); renderList(); renderDashboard(); alert('已清空');
  }
}

backupJSON=async function(){try{showToast('正在打包账目与票据…');downloadJSON(await buildFullBackup(),'完整记账备份_'+dayKey(Date.now())+'.json');showToast('完整备份已下载');}catch(e){alert(e.message);}};
const backupButton=document.querySelector('[onclick="backupJSON()"]');if(backupButton)backupButton.textContent='💾 完整备份（含票据）';
function validateCategoryList(items){if(!Array.isArray(items)||!items.length)throw Error('分类列表无效');const ids=new Set(),names=new Set();return items.map(c=>{if(!c||typeof c.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(c.id)||typeof c.name!=='string'||!c.name.trim()||c.name.length>30||ids.has(c.id)||names.has(c.name))throw Error('分类格式或名称无效');ids.add(c.id);names.add(c.name);return {id:c.id,name:c.name,icon:typeof c.icon==='string'?c.icon.slice(0,12):'📁',hidden:!!c.hidden,purposes:validatePurposes(c.purposes)};});}
function validatedBudgets(value,categories){const result={};if(value==null)return result;if(typeof value!=='object'||Array.isArray(value))throw Error('预算格式无效');for(const [month,b] of Object.entries(value)){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||!b||typeof b!=='object')throw Error('预算月份无效');const next={};for(const [key,v] of Object.entries(b)){if(key!=='total'&&!categories.some(c=>c.id===key))throw Error('预算分类不存在');if(!Number.isFinite(v)||v<0||!Number.isSafeInteger(cents(v)))throw Error('预算金额无效');next[key]=v;}result[month]=next;}return result;}
async function importFullData(data,mode){
 const input=Array.isArray(data)?data:data?.rows;if(!Array.isArray(input))throw Error('备份缺少账目数组');
 const importedCats=data.categories?{expense:validateCategoryList(data.categories.expense),income:validateCategoryList(data.categories.income)}:categorySettings();
 const oldCats=JSON.parse(JSON.stringify(categorySettings())),idMap=new Map(),purposeMap=new Map(),cats={expense:[],income:[]};
 for(const type of ['expense','income']){cats[type]=mode==='replace'?importedCats[type].map(c=>({...c})):oldCats[type].map(c=>({...c}));if(mode!=='replace')importedCats[type].forEach(c=>{let target=cats[type].find(x=>x.name===c.name);if(!target){target={...c,id:cats[type].some(x=>x.id===c.id)?'c_'+crypto.randomUUID():c.id,purposes:[]};cats[type].push(target);}idMap.set(c.id,target.id);target.purposes=target.purposes||[];(c.purposes||[]).forEach(p=>{let existing=target.purposes.find(x=>x.name===p.name);if(!existing){existing={...p,id:target.purposes.some(x=>x.id===p.id)?'p_'+crypto.randomUUID():p.id};target.purposes.push(existing);}purposeMap.set(c.id+':'+p.id,existing.id);});});}
 const incomingBudgets=validatedBudgets(data.budgets,importedCats.expense),nextBudgets=mode==='replace'?incomingBudgets:{...budgets};
 if(mode!=='replace')for(const [month,b] of Object.entries(incomingBudgets))if(!nextBudgets[month])nextBudgets[month]=Object.fromEntries(Object.entries(b).map(([k,v])=>[k==='total'?k:(idMap.get(k)||k),v]));
 const prepared=input.map(r=>{const clone={...r,cat:idMap.get(r.cat)||r.cat,purposeId:purposeMap.get(r.cat+':'+r.purposeId)||r.purposeId||''};const allowed=clone.type==='income'?cats.income:cats.expense;if(!allowed.some(c=>c.id===clone.cat))clone.cat=allowed[allowed.length-1].id;
 // Validate without changing the live categories.
 const validation=normalize({...clone,cat:(clone.type==='income'?INCOME_CATS:CATS)[0].id});return {...validation,cat:clone.cat,receipts:cleanRefs(r.receipts)};});
 const nextRows=mode==='replace'?[]:rows.slice(),counts=new Map(),seen=new Map(),fp=r=>JSON.stringify([dayKey(r.ts),cents(r.amt),r.note,r.type]),added=[];
 nextRows.forEach(r=>counts.set(fp(r),(counts.get(fp(r))||0)+1));
 prepared.forEach(r=>{const key=fp(r),n=(seen.get(key)||0)+1;seen.set(key,n);if(mode!=='replace'&&(nextRows.some(x=>x.id===r.id)||n<=(counts.get(key)||0)))return;if(nextRows.some(x=>x.id===r.id))throw Error('备份中存在重复账目标识');nextRows.push(r);added.push(r);});
 const fileList=data.files??[];if(!Array.isArray(fileList))throw Error('票据文件列表无效');const fileMap=new Map();fileList.forEach(f=>{if(fileMap.has(f.id))throw Error('票据标识重复');fileMap.set(f.id,f);});
 const blobs=[],remapped=new Map();
 for(const r of added){for(const ref of r.receipts){if(remapped.has(ref.id)){ref.id=remapped.get(ref.id);continue;}const f=fileMap.get(ref.id);
 if(!f){const existing=await receiptStore('readonly',s=>s.get(ref.id));if(!existing?.blob)throw Error('备份缺少票据文件：'+ref.name);continue;}
 if(!allowedReceiptTypes.includes(f.type)||typeof f.data!=='string'||f.data.length>15*1024*1024||!f.data.startsWith('data:'+f.type+';base64,'))throw Error('票据格式无效');
 const bytes=Uint8Array.from(atob(f.data.split(',')[1]),c=>c.charCodeAt(0));if(!bytes.length||bytes.length>10*1024*1024)throw Error('票据大小无效');
 const id='r_'+crypto.randomUUID();blobs.push({id,name:ref.name,type:f.type,size:bytes.length,blob:new Blob([bytes],{type:f.type})});remapped.set(ref.id,id);ref.id=id;ref.type=f.type;ref.size=bytes.length;}}
 if(mode==='replace'&&!confirm('完整恢复将替换当前账本、分类和预算。是否先下载当前完整备份并继续？'))return {cancelled:true};
 if(mode==='replace')await backupBeforeRestore();
 if(blobs.length)await receiptStore('readwrite',s=>{blobs.forEach(f=>s.put(f));});
 const oldRows=rows,oldBudgets=budgets,oldDrafts=budgetDrafts,oldSubmissions=budgetSubmissions,oldBlocked=storageBlocked;
 const drafts=mode==='replace'?{}:{...budgetDrafts},submissions=mode==='replace'?{}:{...budgetSubmissions};
 if(data.drafts!=null){if(typeof data.drafts!=='object'||Array.isArray(data.drafts))throw Error('预算草稿格式无效');for(const [month,items] of Object.entries(data.drafts)){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||!Array.isArray(items))throw Error('预算草稿格式无效');const clean=items.map(x=>{if(!x||typeof x.name!=='string'||x.name.length>30||typeof x.amount!=='string'||x.amount.length>40)throw Error('预算草稿内容无效');return {cat:idMap.get(x.cat)||String(x.cat||''),name:x.name,amount:x.amount};});if(mode==='replace'||!drafts[month])drafts[month]=clean;}}
 if(data.submissions!=null){if(typeof data.submissions!=='object'||Array.isArray(data.submissions))throw Error('预算提交信息无效');for(const [month,meta] of Object.entries(data.submissions)){if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||!meta||!Number.isFinite(meta.at)||typeof meta.signature!=='string')throw Error('预算提交信息无效');if(mode==='replace'||!submissions[month])submissions[month]={at:meta.at,signature:meta.signature};}}
 try{persistSettings(cats,nextBudgets,drafts,submissions);rows=nextRows;storageBlocked=false;save();}
 catch(e){rows=oldRows;storageBlocked=oldBlocked;persistSettings(oldCats,oldBudgets,oldDrafts,oldSubmissions);throw e;}

async function backupBeforeRestore(){downloadJSON(await buildFullBackup(),'恢复前备份_'+dayKey(Date.now())+'.json');}
handleImport=async function(event){
 const file=event.target.files[0];if(!file)return;
 try{let data;if(/\.json$/i.test(file.name))data=JSON.parse(await file.text());else{
 if(typeof XLSX==='undefined')throw Error('Excel组件未加载，请联网刷新');
 const book=XLSX.read(await file.arrayBuffer(),{type:'array'});data=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]]).map(r=>{const type=r['类型']==='收入'?'income':r['类型']==='退款'?'refund':r['类型']==='支出'?'expense':'invalid',list=type==='income'?INCOME_CATS:CATS;return {id:crypto.randomUUID(),ts:excelDate(r['日期']),amt:Number(r['金额']),type,cat:list.find(c=>c.name===r['分类'])?.id||list[list.length-1].id,note:r['备注']==null?'':String(r['备注']),isReimburse:['已报销','待报销'].includes(r['报销状态']),reimbursed:r['报销状态']==='已报销'};});}

<script>
/* 预算进度卡及单手导航；兼容旧备份中的历史细分数据。 */
function validatePurposes(items){
 if(items==null)return [];if(!Array.isArray(items)||items.length>300)throw Error('用途列表无效');
 const ids=new Set(),names=new Set();return items.map(p=>{if(!p||typeof p.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(p.id)||typeof p.name!=='string'||!p.name.trim()||p.name.length>30||ids.has(p.id)||names.has(p.name))throw Error('用途名称或标识无效');ids.add(p.id);names.add(p.name);return {id:p.id,name:p.name,hidden:!!p.hidden};});
}
const tableWrap=$('dashboard-tbody').closest('.table-wrap');tableWrap.hidden=true;
const cardSection=document.createElement('section');cardSection.id='budget-visual';cardSection.innerHTML='<div class="budget-visual-head"><h3>各项预算，还能花多少</h3><button class="action-btn" id="visual-edit-budget">调整预算</button></div><div class="budget-card-grid" id="budget-cards"></div>';tableWrap.after(cardSection);
$('visual-edit-budget').onclick=()=>{planMonth=selectedMonth;switchView('budget');};
function budgetCardData(){
 const items=rows.filter(r=>r.type!=='income'&&!r.isReimburse&&dayKey(r.ts).startsWith(selectedMonth)),b=budgets[selectedMonth]||{};
 return CATS.map(c=>{const entries=items.filter(r=>r.cat===c.id),spent=stats(entries).expense,cap=b[c.id],ratio=cap?spent/cap:0;return {category:c,entries,spent,cap,ratio,rank:cap?(ratio>1?0:ratio>=.8?1:3):2};}).filter(x=>x.cap||x.entries.length).sort((a,b)=>a.rank-b.rank||b.ratio-a.ratio||b.spent-a.spent);
}
function renderBudgetCards(){
 const box=$('budget-cards'),openIds=new Set(Array.from(box.querySelectorAll('details[open]')).map(el=>el.dataset.category));box.innerHTML='';
 const data=budgetCardData();if(!data.length){box.innerHTML='<div class="empty">提交本月预算后，这里会显示各项开销进度</div>';return;}
 data.forEach(({category,entries,spent,cap,ratio})=>{
 const card=document.createElement('details');card.dataset.category=category.id;card.className='budget-card '+(!cap?'unplanned':ratio>1?'over':ratio>=.8?'near':'');card.open=openIds.has(category.id);
 const remaining=cap-spent,summary=document.createElement('summary');
 summary.innerHTML='<div class="budget-card-heading"><strong>'+escapeText(category.icon||'📁')+' '+escapeText(category.name)+'</strong><small>'+(cap?'预算 ¥'+fmt(cap):'未设预算')+'</small></div><div class="budget-card-values"><div><span>已花</span><strong>¥'+money(spent)+'</strong></div><div><span>'+(cap?(remaining<0?'已超支':'还可花'):'预算待设置')+'</span><strong>'+(cap?'¥'+fmt(remaining):'—')+'</strong></div></div><div class="budget-card-meter" role="progressbar" aria-label="'+escapeText(category.name)+'预算使用率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.min(100,Math.max(0,ratio*100)).toFixed(0)+'"><i style="width:'+Math.min(100,Math.max(0,ratio*100))+'%"></i></div><div class="budget-card-footer"><span>'+(cap?'已用 '+Math.max(0,ratio*100).toFixed(0)+'%':'已有开销，建议补充预算')+'</span><span class="card-open-label">查看流水 · '+entries.length+' 笔</span></div>';
 card.appendChild(summary);
 const detail=document.createElement('div');detail.className='budget-detail';
 if(!entries.length){const empty=document.createElement('p');empty.className='plan-state';empty.textContent='还没有开销';detail.appendChild(empty);}
 const transactions=document.createElement('div');transactions.className='budget-transactions';entries.slice().sort((a,b)=>b.ts-a.ts).forEach(r=>{const btn=document.createElement('button');btn.className='budget-transaction';btn.innerHTML='<span>'+escapeText(category.name)+'<small>'+dayKey(r.ts)+' '+escapeText(r.note||'')+'</small></span><strong>¥'+money(r.type==='refund'?-r.amt:r.amt)+'</strong>';btn.onclick=()=>openEdit(r.id);transactions.appendChild(btn);});detail.appendChild(transactions);
 if(!cap){const edit=document.createElement('button');edit.className='action-btn';edit.textContent='为此大类补预算';edit.onclick=()=>{planMonth=selectedMonth;switchView('budget');const existing=collectPlan().some(x=>x.cat===category.id||x.name===category.name);if(!existing){appendPlanLine({cat:category.id,name:category.name});updatePlanDraft();}};detail.appendChild(edit);}
 card.appendChild(detail);box.appendChild(card);
 });
}
const hierarchicalDashboard=renderDashboard;renderDashboard=function(){hierarchicalDashboard();renderBudgetCards();};
const pageOrder=['record','budget','dashboard','receipts'],pageLabels={record:['<path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9M15 5l4 4M10 14l1-4L18 3a2 2 0 0 1 3 3l-7 7-4 1ZM7 17h7"/>','记一笔'],budget:['<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8v3H8zM8 13h1m3 0h1m3 0h0M8 17h1m3 0h1m3-4v5"/>','月度预算'],dashboard:['<path d="M3 3v18h18M7 16v-5m5 5V6m5 10v-8"/>','收支看板'],receipts:['<path d="M6 3l2 1 2-1 2 1 2-1 2 1 2-1v18l-2-1-2 1-2-1-2 1-2-1-2 1V3ZM9 8h6M9 12h6M9 16h3"/>','报销票据']};
const nav=document.querySelector('.nav');nav.setAttribute('aria-label','主导航');
pageOrder.forEach(view=>{const b=$('nav-'+view);b.innerHTML='<span class="page-nav-icon" aria-hidden="true"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+pageLabels[view][0]+'</svg></span><span>'+pageLabels[view][1]+'</span>';nav.appendChild(b);});
let currentPage='record',pageScroll={record:0,budget:0,dashboard:0,receipts:0},navigationFrame;
const oneHandSwitch=switchView;
switchView=function(view){
 if(!pageOrder.includes(view))return;
 if(currentPage!==view)pageScroll[currentPage]=window.scrollY;
 if(currentPage==='budget'&&$('plan-lines').children.length)updatePlanDraft();
 oneHandSwitch(view);currentPage=view;
 pageOrder.forEach(v=>{const b=$('nav-'+v);if(v===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 cancelAnimationFrame(navigationFrame);navigationFrame=requestAnimationFrame(()=>{window.scrollTo({top:pageScroll[view]||0,behavior:'instant'});if(view==='dashboard'&&chartInstance)chartInstance.resize();});
};
let swipe=null,draggingRow=false;
document.addEventListener('touchstart',e=>{
 swipe=null;if(!matchMedia('(max-width:760px)').matches||e.touches.length!==1||receiptSaving||document.querySelector('.modal-overlay.show'))return;
 const target=e.target;if(target.closest('input,textarea,select,button,a,.row,.nav,.cats,.budget-transactions,#chart-container,iframe')||document.activeElement?.matches('input,textarea,select'))return;
 const t=e.touches[0];if(t.clientX<24||t.clientX>innerWidth-24)return;
 swipe={x:t.clientX,y:t.clientY,lastX:t.clientX,lastY:t.clientY,time:performance.now(),direction:null};
},{passive:true});
document.addEventListener('touchmove',e=>{
 if(!swipe||e.touches.length!==1||draggingRow){swipe=null;return;}
 const t=e.touches[0],dx=t.clientX-swipe.x,dy=t.clientY-swipe.y;swipe.lastX=t.clientX;swipe.lastY=t.clientY;
 if(!swipe.direction&&(Math.abs(dx)>12||Math.abs(dy)>12))swipe.direction=Math.abs(dx)>Math.abs(dy)*1.6?'horizontal':'vertical';
 if(swipe.direction==='horizontal'&&e.cancelable)e.preventDefault();
},{passive:false});
document.addEventListener('touchend',()=>{
 const s=swipe;swipe=null;if(!s||s.direction!=='horizontal'||performance.now()-s.time>900||draggingRow)return;
 const dx=s.lastX-s.x,dy=s.lastY-s.y;if(Math.abs(dx)<65||Math.abs(dx)<Math.abs(dy)*1.6)return;
 const next=pageOrder.indexOf(currentPage)+(dx<0?1:-1);if(next>=0&&next<pageOrder.length)switchView(pageOrder[next]);
},{passive:true});
document.addEventListener('touchcancel',()=>{swipe=null;},{passive:true});
document.addEventListener('start',e=>{if(e.target.closest?.('.rows'))draggingRow=true;});
document.addEventListener('end',()=>{draggingRow=false;});
</script>
