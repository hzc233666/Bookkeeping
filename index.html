<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f8">
<title>轻量记账 & 可视化看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f7f7f8; --card:#fff; --text:#111114; --sub:#8a8a8e; --line:#e9e9ec; --accent:#111114;
  --green:#34c759; --red:#ff3b30; --yellow:#ffcc00; --blue:#007aff; --orange:#ff9500;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0d0d0f; --card:#1a1a1d; --text:#f2f2f4; --sub:#8e8e93; --line:#2b2b2f; --accent:#f2f2f4; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html, body {
  margin: 0; padding: 0; width: 100%; max-width: 100vw;
  overflow-x: hidden; position: relative; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width: 900px; width: 100%; margin: 0 auto; padding: 20px 16px calc(60px + env(safe-area-inset-bottom)); overflow-x: hidden;}

/* 导航 */
.nav{display:flex;gap:10px;margin-bottom:20px;justify-content:center;}
.nav button{padding:10px 20px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:.2s;}
.nav button.on{background:var(--accent);color:var(--card);border-color:var(--accent);}
.view{display:none;width:100%;}
.view.on{display:block;}

/* 记账页 */
.header-stats{text-align:center;margin-bottom:20px;}
.total{font-size:40px;font-weight:700;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:16px;width:100%;}
.type-toggle{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:12px;width:100%;}
.type-toggle button{flex:1;padding:8px;border-radius:8px;border:0;background:transparent;color:var(--sub);font-size:14px;font-weight:600;cursor:pointer;transition:.2s;}
.type-toggle button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.amtrow{display:flex;align-items:center;gap:6px;padding:2px 6px 8px;width:100%;}
.cur{font-size:26px;font-weight:600;color:var(--sub);}
#amt{flex:1;min-width:0;border:0;background:transparent;outline:none;color:var(--text);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;width:100%;}
.cats::-webkit-scrollbar{display:none;}
.cat{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--sub);padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;white-space:nowrap;}
.cat.on{background:var(--accent);color:var(--card);border-color:var(--accent);}
.note-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;width:100%;}
.note{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:15px;outline:none;}
/* 报销开关 */
.reimburse-toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;white-space:nowrap;padding:4px 8px;border-radius:8px;background:var(--bg);user-select:none;}
.reimburse-toggle input{width:16px;height:16px;accent-color:var(--orange);cursor:pointer;}
.reimburse-toggle.active{color:var(--orange);font-weight:600;background:rgba(255,149,0,0.1);}
.btns{display:flex;gap:8px;margin-top:16px;width:100%;}
.primary{flex:1;background:var(--accent);color:var(--card);border-radius:12px;padding:13px;font-size:15px;font-weight:600;border:0;cursor:pointer;width:100%;}

/* 列表 */
.dayhd{display:flex;justify-content:space-between;padding:0 6px 8px;font-size:12px;color:var(--sub);}
.rows{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);width:100%;}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;}
.row:last-child{border-bottom:0;}
.row:active{background:var(--bg);}
.ico{width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:var(--bg);display:grid;place-items:center;font-size:16px;}
.mid{flex:1;min-width:0;}
.cname{font-size:14px;display:flex;align-items:center;gap:6px;}
.memo{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.num{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.num.income{color:var(--green);}
.num.reimburse{color:var(--orange);}
/* 报销标签 */
.tag-reimburse{font-size:10px;padding:1px 4px;border-radius:4px;background:rgba(255,149,0,0.15);color:var(--orange);border:1px solid rgba(255,149,0,0.3);font-weight:normal;}
.tag-reimbursed{font-size:10px;padding:1px 4px;border-radius:4px;background:var(--bg);color:var(--sub);border:1px solid var(--line);font-weight:normal;}
.empty{text-align:center;color:var(--sub);font-size:13px;line-height:2;padding:56px 0;}

/* 看板页 */
.action-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.action-btn{background:var(--card);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.action-btn.danger{color:var(--red);}

/* 待报销看板卡片 */
.reimburse-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid var(--orange);display:none;}
.reimburse-card.show{display:block;}
.rc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.rc-title{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px;}
.rc-amount{font-size:20px;font-weight:700;color:var(--orange);}
.rc-list{max-height:200px;overflow-y:auto;margin-bottom:12px;}
.rc-item{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line);}
.rc-item:last-child{border-bottom:0;}
.rc-item-left{color:var(--sub);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rc-item-right{font-weight:600;color:var(--orange);white-space:nowrap;margin-left:10px;}
.btn-settle{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:10px;font-size:13px;font-weight:600;width:100%;cursor:pointer;}

.dashboard-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;width:100%;}
@media (max-width: 768px) { .dashboard-grid{grid-template-columns:1fr;} }
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;}
.stat-card{background:var(--card);border-radius:16px;padding:16px;text-align:center;width:100%;}
.stat-card .lbl{font-size:12px;color:var(--sub);margin-bottom:8px;}
.stat-card .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
.stat-card.income .val{color:var(--green);}
.stat-card.expense .val{color:var(--red);}

/* 表格 */
.table-wrap{background:var(--card);border-radius:16px;overflow-x:auto;box-shadow:0 1px 3px rgba(0,0,0,.06);width:100%;max-width:100%;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:500px;}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);}
th{color:var(--sub);font-weight:500;background:var(--bg);}
tr:last-child td{border-bottom:0;}
.progress-bar{width:100px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
.progress-fill{height:100%;border-radius:4px;background:var(--blue);}
.status{display:inline-flex;align-items:center;gap:4px;font-size:12px;}
.status.ok{color:var(--green);}
.status.warn{color:var(--yellow);}

/* 图表 */
#chart-container{width:100%;height:350px;background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-top:16px;box-sizing:border-box;}

/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:1000;padding:20px;}
.modal-overlay.show{display:grid;}
.modal{background:var(--card);width:100%;max-width:400px;border-radius:20px;padding:20px;}
.modal h3{margin:0 0 16px;font-size:18px;}
.modal input,.modal select{width:100%;padding:12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--bg);color:var(--text);outline:none;}
.modal .btns{display:flex;gap:10px;margin-top:20px;}
.modal .btn-del{background:var(--red);color:#fff;border-radius:10px;padding:12px;flex:1;font-weight:600;border:0;cursor:pointer;}
.modal .btn-save{background:var(--accent);color:var(--card);border-radius:10px;padding:12px;flex:2;font-weight:600;border:0;cursor:pointer;}

/* Toast */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);z-index:99;background:#18181b;color:#fff;padding:12px 18px;border-radius:13px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <button id="nav-record" class="on" onclick="switchView('record')">📝 记账</button>
    <button id="nav-dashboard" onclick="switchView('dashboard')">📊 看板</button>
  </div>

  <!-- 记账页 -->
  <div id="view-record" class="view on">
    <header class="header-stats">
      <div class="lbl">本月日常支出</div>
      <div class="total" id="total">¥0.00</div>
    </header>

    <section class="card">
      <div class="type-toggle">
        <button id="btn-expense" class="on" onclick="setType('expense')">支出</button>
        <button id="btn-income" onclick="setType('income')">收入</button>
      </div>
      <div class="amtrow">
        <span class="cur">¥</span>
        <input id="amt" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </div>
      <div class="cats" id="cats"></div>
      
      <div class="note-row">
        <input id="note" class="note" placeholder="备注(可选)" autocomplete="off" maxlength="40">
        <!-- 待报销开关 -->
        <label class="reimburse-toggle" id="reimburse-label">
          <input type="checkbox" id="isReimburse"> 💼 垫付待报销
        </label>
      </div>

      <div class="btns">
        <button id="add" class="primary">记一笔支出</button>
      </div>
    </section>

    <div id="list"></div>
  </div>

  <!-- 看板页 -->
  <div id="view-dashboard" class="view">
    <div class="action-bar">
      <h2 style="margin:0;font-size:20px;">数据看板</h2>
      <div>
        <button class="action-btn" onclick="exportExcel()">📥 导出 Excel</button>
        <button class="action-btn danger" onclick="clearAllData()">🗑️ 清空</button>
      </div>
    </div>

    <!-- 待报销模块（默认隐藏，有数据时显示） -->
    <div class="reimburse-card" id="reimburse-board">
      <div class="rc-header">
        <div class="rc-title">💼 本月待报销明细</div>
        <div class="rc-amount" id="rc-total">¥0.00</div>
      </div>
      <div class="rc-list" id="rc-list">
        <!-- 动态渲染 -->
      </div>
      <button class="btn-settle" onclick="settleReimburse()">✅ 标记为已报销（不再显示）</button>
    </div>
    
    <div class="dashboard-grid">
      <div class="stat-cards">
        <div class="stat-card income">
          <div class="lbl">本月总收入</div>
          <div class="val" id="dash-income">¥0.00</div>
        </div>
        <div class="stat-card expense">
          <div class="lbl">本月日常支出</div>
          <div class="val" id="dash-expense">¥0.00</div>
        </div>
        <div class="stat-card avg">
          <div class="lbl">平均日支出</div>
          <div class="val" id="dash-avg">¥0.00</div>
        </div>
        <div class="stat-card avg">
          <div class="lbl">日均收入</div>
          <div class="val" id="dash-avg-income">¥0.00</div>
        </div>
      </div>
      <div id="chart-container"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>账目类型</th>
            <th>日常支出(不含报销)</th>
            <th>本月占比</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="dashboard-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>修改记录</h3>
    <input type="number" id="edit-amt" step="0.01" placeholder="金额">
    <select id="edit-cat"></select>
    <input type="text" id="edit-note" placeholder="备注" maxlength="40">
    <!-- 编辑时也可以修改报销状态 -->
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:14px;">
      <input type="checkbox" id="edit-reimburse" style="width:18px;height:18px;margin:0;accent-color:var(--orange);">
      <label for="edit-reimburse" style="color:var(--orange);">💼 标记为待报销</label>
    </div>
    <div class="btns">
      <button class="btn-del" onclick="deleteRecord()">删除</button>
      <button class="btn-save" onclick="saveEdit()">保存修改</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= 基础数据 ================= */
const CATS = [
  { id: 'food',    name: '餐饮', icon: '🍜' },
  { id: 'traffic', name: '交通', icon: '🚇' },
  { id: 'shop',    name: '购物', icon: '🛍️' },
  { id: 'daily',   name: '日用', icon: '🧴' },
  { id: 'fun',     name: '娱乐', icon: '🎬' },
  { id: 'home',    name: '住宿', icon: '🏠' },
  { id: 'med',     name: '医疗', icon: '💊' },
  { id: 'other',   name: '其他', icon: '📦' }
];
const INCOME_CATS = [
  { id: 'salary', name: '工资', icon: '💰' },
  { id: 'bonus',  name: '奖金', icon: '🎁' },
  { id: 'invest', name: '理财', icon: '📈' },
  { id: 'other_in',name: '其他', icon: '💵' }
];

const KEY = 'linkbook.v4'; // 升级版本号
let rows = load();
let currentType = 'expense'; 
let currentCat = 'food';
let editingId = null;
let chartInstance = null;

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(d)) return d;
    return []; 
  } catch(e) { return []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(rows)); }
function p2(n) { return String(n).padStart(2, '0'); }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }
function fmt(n) {
  const s = Math.abs(Number(n)||0).toFixed(2), parts = s.split('.');
  return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + parts[1];
}

/* ================= 页面切换 ================= */
function switchView(view) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('on'));
  document.getElementById('view-' + view).classList.add('on');
  document.querySelectorAll('.nav button').forEach(el => el.classList.remove('on'));
  document.getElementById('nav-' + view).classList.add('on');
  
  if (view === 'dashboard') {
    renderDashboard();
  } else {
    renderList();
  }
}

/* ================= 记账页逻辑 ================= */
function setType(type) {
  currentType = type;
  document.getElementById('btn-expense').classList.toggle('on', type === 'expense');
  document.getElementById('btn-income').classList.toggle('on', type === 'income');
  renderCats();
  document.getElementById('add').textContent = type === 'expense' ? '记一笔支出' : '记一笔收入';
  if (type === 'expense') currentCat = 'food';
  else currentCat = 'salary';
}

function renderCats() {
  const catsEl = document.getElementById('cats');
  catsEl.innerHTML = '';
  const list = currentType === 'expense' ? CATS : INCOME_CATS;
  list.forEach(c => {
    const b = document.createElement('button');
    b.className = 'cat' + (c.id === currentCat ? ' on' : '');
    b.textContent = c.icon + ' ' + c.name;
    b.onclick = () => { currentCat = c.id; renderCats(); };
    catsEl.appendChild(b);
  });
}

// 监听报销复选框UI变化
document.getElementById('isReimburse').addEventListener('change', function() {
  document.getElementById('reimburse-label').classList.toggle('active', this.checked);
});

function commit() {
  const amt = parseFloat(document.getElementById('amt').value);
  if (!isFinite(amt) || amt <= 0) { alert('请输入正确金额'); return; }
  const note = document.getElementById('note').value.trim().slice(0, 40);
  const isReimburse = document.getElementById('isReimburse').checked;
  
  rows.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    ts: Date.now(),
    amt: Math.round(amt * 100) / 100,
    cat: currentCat,
    note,
    type: currentType,
    isReimburse: isReimburse,
    reimbursed: false // 是否已结清
  });
  save();
  
  document.getElementById('amt').value = '';
  document.getElementById('note').value = '';
  document.getElementById('isReimburse').checked = false;
  document.getElementById('reimburse-label').classList.remove('active');
  
  renderList();
  updateTopStats();
  showToast(isReimburse ? '已记入垫付账单' : '记账成功');
}

// 列表渲染
function renderList() {
  const listEl = document.getElementById('list');
  if (!rows.length) {
    listEl.innerHTML = '<div class="empty">还没有记录，记一笔吧</div>';
    return;
  }
  const sorted = rows.slice().sort((a,b) => b.ts - a.ts);
  const groups = new Map();
  sorted.forEach(r => {
    const k = dayKey(r.ts);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  });

  let html = '';
  groups.forEach((items, k) => {
    let expSum = 0, incSum = 0;
    items.forEach(r => {
      // 统计时只算日常收支，垫付的钱不参与总额（因为那是公司的钱）
      if (r.type === 'income') incSum += r.amt;
      else if (!r.isReimburse) expSum += r.amt;
    });
    
    let sumStr = '';
    if (expSum > 0) sumStr += `支出 ¥${fmt(expSum)} `;
    if (incSum > 0) sumStr += `收入 ¥${fmt(incSum)}`;

    html += `<div class="day"><div class="dayhd"><span>${k}</span><span>${sumStr}</span></div><div class="rows">`;
    items.forEach(r => {
      const isInc = r.type === 'income';
      const catObj = (isInc ? INCOME_CATS : CATS).find(c => c.id === r.cat) || (isInc ? INCOME_CATS[3] : CATS[7]);
      const isR = r.isReimburse && !r.reimbursed;
      const isDone = r.isReimburse && r.reimbursed;
      
      // 颜色和数字处理
      let numClass = isInc ? 'income' : '';
      if (isR) numClass = 'reimburse';
      
      let tagHtml = '';
      if (isR) tagHtml = '<span class="tag-reimburse">待报销</span>';
      else if (isDone) tagHtml = '<span class="tag-reimbursed">已报销</span>';

      html += `<div class="row" onclick="openEdit('${r.id}')">
        <div class="ico">${catObj.icon}</div>
        <div class="mid">
          <div class="cname">${catObj.name} ${tagHtml}</div>
          ${r.note ? `<div class="memo">${r.note}</div>` : ''}
        </div>
        <div class="num ${numClass}">${isInc?'+':'-'}${fmt(r.amt)}</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  listEl.innerHTML = html;
}

function updateTopStats() {
  const now = new Date();
  let mTotal = 0;
  rows.forEach(r => {
    // 只统计：支出 + 不是报销
    if (r.type === 'expense' && !r.isReimburse) {
      const d = new Date(r.ts);
      if (d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) mTotal += r.amt;
    }
  });
  document.getElementById('total').textContent = '¥' + fmt(mTotal);
}

/* ================= 编辑与删除 ================= */
function openEdit(id) {
  const r = rows.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  
  const catSelect = document.getElementById('edit-cat');
  catSelect.innerHTML = '';
  const list = r.type === 'income' ? INCOME_CATS : CATS;
  list.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.icon + ' ' + c.name;
    if (c.id === r.cat) opt.selected = true;
    catSelect.appendChild(opt);
  });

  document.getElementById('edit-amt').value = r.amt;
  document.getElementById('edit-note').value = r.note || '';
  document.getElementById('edit-reimburse').checked = !!r.isReimburse;
  
  document.getElementById('modal').classList.add('show');
}

function saveEdit() {
  const r = rows.find(x => x.id === editingId);
  if (!r) return;
  const amt = parseFloat(document.getElementById('edit-amt').value);
  if (isFinite(amt) && amt > 0) {
    r.amt = Math.round(amt * 100) / 100;
    r.cat = document.getElementById('edit-cat').value;
    r.note = document.getElementById('edit-note').value.trim();
    r.isReimburse = document.getElementById('edit-reimburse').checked;
    // 如果取消报销，重置状态
    if (!r.isReimburse) r.reimbursed = false;
    
    save();
    renderList();
    updateTopStats();
  }
  closeModal();
}

function deleteRecord() {
  rows = rows.filter(x => x.id !== editingId);
  save();
  renderList();
  updateTopStats();
  closeModal();
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  editingId = null;
}

/* ================= 看板逻辑 ================= */
function renderDashboard() {
  const now = new Date();
  const curMonthRows = rows.filter(r => {
    const d = new Date(r.ts);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  });

  let totalIncome = 0, totalExpense = 0;
  let pendingReimburseSum = 0;
  let pendingReimburseItems = [];

  curMonthRows.forEach(r => {
    if (r.type === 'income') {
      totalIncome += r.amt;
    } else if (r.isReimburse && !r.reimbursed) {
      // 垫付且未结清
      pendingReimburseSum += r.amt;
      pendingReimburseItems.push(r);
    } else if (!r.isReimburse) {
      // 真实日常支出
      totalExpense += r.amt;
    }
  });

  // 渲染待报销模块
  const rbBoard = document.getElementById('reimburse-board');
  if (pendingReimburseItems.length > 0) {
    rbBoard.classList.add('show');
    document.getElementById('rc-total').textContent = '¥' + fmt(pendingReimburseSum);
    
    // 按时间排序
    pendingReimburseItems.sort((a,b) => b.ts - a.ts);
    let rlHtml = '';
    pendingReimburseItems.forEach(r => {
      const cat = CATS.find(c => c.id === r.cat) || CATS[7];
      rlHtml += `<div class="rc-item">
        <div class="rc-item-left">${dayKey(r.ts).slice(5)} · ${cat.name} ${r.note ? `(${r.note})` : ''}</div>
        <div class="rc-item-right">¥${fmt(r.amt)}</div>
      </div>`;
    });
    document.getElementById('rc-list').innerHTML = rlHtml;
  } else {
    rbBoard.classList.remove('show');
  }

  // 统计卡片
  const dayOfMonth = now.getDate();
  document.getElementById('dash-income').textContent = '¥' + fmt(totalIncome);
  document.getElementById('dash-expense').textContent = '¥' + fmt(totalExpense);
  document.getElementById('dash-avg').textContent = '¥' + fmt(totalExpense / dayOfMonth);
  document.getElementById('dash-avg-income').textContent = '¥' + fmt(totalIncome / dayOfMonth);

  // 分类占比表格
  const catExpense = {};
  CATS.forEach(c => catExpense[c.id] = 0);
  curMonthRows.forEach(r => {
    if (r.type === 'expense' && !r.isReimburse) { // 只统计日常支出
      if (catExpense[r.cat] !== undefined) catExpense[r.cat] += r.amt;
      else catExpense['other'] += r.amt;
    }
  });

  let tbody = '';
  let hasData = false;
  CATS.forEach(c => {
    const exp = catExpense[c.id];
    if (exp === 0) return; 
    hasData = true;
    
    const pct = totalExpense > 0 ? (exp / totalExpense * 100) : 0;
    let statusCls = 'ok', statusText = '正常';
    if (pct > 50) { statusCls = 'warn'; statusText = '占比较高'; }

    tbody += `<tr>
      <td><b>${c.name}</b></td>
      <td>¥${fmt(exp)}</td>
      <td>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        ${pct.toFixed(1)}%
      </td>
      <td><span class="status ${statusCls}">● ${statusText}</span></td>
    </tr>`;
  });

  if (!hasData) {
    tbody = '<tr><td colspan="4" style="text-align:center; color:var(--sub); padding:32px 0;">本月暂无日常支出记录</td></tr>';
  }
  document.getElementById('dashboard-tbody').innerHTML = tbody;

  renderChart();
}

// 一键结清报销
function settleReimburse() {
  if (!confirm('确定要把这些待报销的账目标记为“已报销”吗？标记后将从看板隐藏，但流水记录保留。')) return;
  const now = new Date();
  rows.forEach(r => {
    const d = new Date(r.ts);
    if (r.isReimburse && !r.reimbursed && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()) {
      r.reimbursed = true;
    }
  });
  save();
  renderDashboard();
  renderList();
  showToast('已结清！');
}

/* ================= 图表 ================= */
function renderChart() {
  if (!chartInstance) {
    chartInstance = echarts.init(document.getElementById('chart-container'));
  }
  
  const months = [];
  const expData = [];
  const incData = [];
  const now = new Date();
  
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const y = d.getFullYear();
    const m = d.getMonth();
    months.push((m + 1) + '月');
    
    let exp = 0, inc = 0;
    rows.forEach(r => {
      const rd = new Date(r.ts);
      if (rd.getFullYear() === y && rd.getMonth() === m) {
        if (r.type === 'income') inc += r.amt;
        else if (!r.isReimburse) exp += r.amt; // 图表里也不统计报销垫付
      }
    });
    expData.push(exp);
    incData.push(inc);
  }

  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const textColor = isDark ? '#8e8e93' : '#8a8a8e';

  chartInstance.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    legend: { data: ['日常支出', '收入'], textStyle: { color: textColor } },
    grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
    xAxis: { 
      type: 'category', data: months,
      axisLine: { lineStyle: { color: textColor } },
      axisLabel: { color: textColor }
    },
    yAxis: { 
      type: 'value',
      axisLabel: { color: textColor, formatter: '¥{value}' },
      splitLine: { lineStyle: { color: isDark ? '#2b2b2f' : '#e9e9ec' } }
    },
    series: [
      { name: '日常支出', type: 'bar', data: expData, itemStyle: { color: '#ff3b30', borderRadius: [4,4,0,0] }, barMaxWidth: 30 },
      { name: '收入', type: 'bar', data: incData, itemStyle: { color: '#34c759', borderRadius: [4,4,0,0] }, barMaxWidth: 30 }
    ]
  });
}

/* ================= 其他 ================= */
function exportExcel() {
  if (!rows.length) { alert('没有数据可导出'); return; }
  const exportData = rows.map(r => {
    const d = new Date(r.ts);
    const catObj = (r.type === 'income' ? INCOME_CATS : CATS).find(c => c.id === r.cat);
    let tag = '';
    if (r.isReimburse) tag = r.reimbursed ? '已报销' : '待报销';
    return {
      '日期': `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`,
      '类型': r.type === 'income' ? '收入' : '支出',
      '分类': catObj ? catObj.name : '其他',
      '金额': r.amt,
      '报销状态': tag,
      '备注': r.note || ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(exportData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "账单明细");
  XLSX.writeFile(wb, `记账数据_${dayKey(Date.now())}.xlsx`);
}

function clearAllData() {
  if (confirm('确定要清空所有本地记账数据吗？此操作不可恢复。')) {
    rows = []; save(); updateTopStats(); renderList(); renderDashboard(); alert('数据已清空');
  }
}

const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

window.onload = () => {
  setType('expense');
  updateTopStats();
  renderList();
  document.getElementById('add').onclick = commit;
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (document.getElementById('view-dashboard').classList.contains('on')) renderChart();
  });
};
</script>
